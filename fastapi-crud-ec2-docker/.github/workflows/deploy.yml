name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_DIR: /home/ubuntu/fastapi-crud-ec2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Create release archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            -czf release.tgz .

      - name: Upload archive to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 release.tgz "$EC2_USER@$EC2_HOST:/tmp/release.tgz"

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$EC2_USER@$EC2_HOST" "APP_DIR='${APP_DIR}' bash -s" <<'EOF_REMOTE'
            set -euo pipefail

            WORK_DIR=$(mktemp -d)
            mkdir -p "$APP_DIR"
            tar -xzf /tmp/release.tgz -C "$WORK_DIR"
            rm -f /tmp/release.tgz

            mkdir -p "$APP_DIR/data"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name data -exec rm -rf {} +
            cp -a "$WORK_DIR"/. "$APP_DIR"/
            rm -rf "$WORK_DIR"

            cd "$APP_DIR"
            mkdir -p data
            docker compose up -d --build --remove-orphans
            docker image prune -f
          EOF_REMOTE